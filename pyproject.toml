[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macula-py"
version = "0.1.0"
description = "Native Python client for the Macula mesh wire protocol -- QUIC transport, deterministic CBOR, Ed25519 identity, BLAKE3 content-addressing, unary RPC, PubSub, content transfer, and streaming RPC (both caller and provider roles)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Macula" }]
requires-python = ">=3.11"
keywords = ["macula", "mesh", "quic", "rpc", "pubsub", "wire-protocol"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "aioquic>=1.2.0",
    "cryptography>=43.0.0",
    "blake3>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/macula-io/macula-py"
Repository = "https://github.com/macula-io/macula-py"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: dials the real production demo fleet -- excluded from default CI, run explicitly with `pytest -m live`",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"
