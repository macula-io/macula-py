[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "macula-py"
version = "0.2.0"
description = "A Python node on the macula 12 mesh: post-quantum identity and key exchange, calls, streams, pub/sub, the DHT and node-served content, over macula-go's C ABI."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Macula" }]
requires-python = ">=3.11"
keywords = ["macula", "mesh", "quic", "rpc", "pubsub", "post-quantum"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Networking",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/macula-io/macula-py"
Repository = "https://github.com/macula-io/macula-py"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
macula_py = ["py.typed", "_native/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
