name: Release to PyPI

# A v* tag publishes that version's five platform wheels to PyPI, through
# Trusted Publishing (OIDC; no token is stored anywhere). Nothing publishes
# unless the tag names pyproject's version, abi/MACULA_GO_REF is a macula-go
# release tag still naming the commit recorded beside it, every released
# library passes its checksum and attestation, the suite is green against
# both that tag's source and its released linux-x64 library, and all five
# wheels built.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag names pyproject's version, and macula-go is pinned to a release
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name pyproject's version $version"
            exit 1
          fi
          ref=$(awk '{print $1}' abi/MACULA_GO_REF)
          case "$ref" in
            v*) ;;
            *) echo "::error::abi/MACULA_GO_REF is $ref, not a macula-go release tag"; exit 1 ;;
          esac

  test:
    needs: guard
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: guard
    uses: ./.github/workflows/wheels.yml
    with:
      library: release

  # The suite again, against the attested linux-x64 library the wheels ship
  # rather than one built from source.
  released-library:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out macula-go at the pinned tag
        run: |
          git clone --quiet https://github.com/macula-io/macula-go.git build/macula-go
          git -C build/macula-go -c advice.detachedHead=false checkout --quiet "$(awk '{print $1}' abi/MACULA_GO_REF)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: build/macula-go/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: native-libraries
          path: build/native
      - name: Build the teststation
        shell: bash
        run: MACULA_GO_DIR="$PWD/build/macula-go" scripts/build_native.sh | sed 's/^export //' >> "$GITHUB_ENV"
      - run: pip install -e ".[dev]"
      - name: The suite, on the released library
        run: MACULA_LIBRARY_PATH="$PWD/build/native/libmacula-linux-x64.so" python -m pytest -v

  publish:
    needs: [test, wheels, released-library]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Every platform's wheel is here
        run: |
          set -eu
          ls -l dist
          for plat in manylinux_2_28_x86_64 manylinux_2_28_aarch64 macosx_13_0_arm64 macosx_13_0_x86_64 win_amd64; do
            ls dist/*-py3-none-*"$plat"*.whl > /dev/null || { echo "::error::no $plat wheel"; exit 1; }
          done
          [ "$(ls dist/*.whl | wc -l)" -eq 5 ] || { echo "::error::expected 5 wheels"; exit 1; }
      # release/v1 is PyPA's recommended way to consume this action for
      # Trusted Publishing.
      - uses: pypa/gh-action-pypi-publish@release/v1
