name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "plans/**", "assets/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # The Go interop capture helper, held to the structural floor
  # (macula-codebase-checks#9): nestif 4, gocognit 15, funlen 60, with no
  # baseline and no inline disables. The thresholds live in
  # scripts/interop/capture/.golangci.yml.
  structural-lint:
    name: lint scripts/interop/capture (structural floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/interop/capture/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: scripts/interop/capture

  # The structural floor (macula-codebase-checks#9): deep nesting and tangled
  # functions fail the build. The thresholds are declared in pyproject.toml's
  # [tool.ruff], with no baseline and no inline disables; ruff is pinned so a
  # preview rule cannot change between releases.
  lint:
    name: structural floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: ruff
        run: |
          python -m pip install --quiet ruff==0.17.1
          ruff check .

  test:
    name: tests (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out macula-go at the pinned ref
        run: |
          git clone --quiet -c core.autocrlf=false https://github.com/macula-io/macula-go.git build/macula-go
          git -C build/macula-go -c advice.detachedHead=false checkout --quiet "$(awk '{print $1}' abi/MACULA_GO_REF)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: build/macula-go/go.mod
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Builds the library and the teststation, and fails when abi/macula.h
      # is not the header at the pinned ref.
      - name: Build macula-go's library and teststation
        shell: bash
        run: MACULA_GO_DIR="$PWD/build/macula-go" scripts/build_native.sh | sed 's/^export //' >> "$GITHUB_ENV"

      - run: pip install -e ".[dev]"

      # The live check (tests/live) skips unless MACULA_PY_LIVE is set; CI
      # never dials the fleet.
      - run: python -m pytest -v

  # The release builds its wheels from macula-go's released libraries instead.
  wheels:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/wheels.yml
    with:
      library: build

  # A dependency the wheel ships with a published advisory fails the build
  # (macula-codebase-checks#11). pip resolves what `pip install .` would bring
  # in without building this project, and pip-audit reads that set; the extra
  # libraries the wheels link (macula-go) are that repository's own gate.
  # release.yml calls this workflow on the tagged commit, so the release
  # waits on it.
  advisories:
    name: Dependency advisories
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/dependency-advisories.yml@83a76a358456bf2f7d6c919ad5e8fe7fd2162ce3
    with:
      ecosystem: python
      python-version: '3.13'
