name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build, offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      # Offline only -- exercises pure logic (identity, deterministic
      # CBOR, golden vectors against the real Erlang encoder). Live tests
      # dial the real production fleet, which has no uptime guarantee and
      # must never block an unrelated PR -- same convention every sibling
      # Macula SDK uses for its own live-tagged tests. Run those manually:
      #   pytest -m live
      - run: pytest -m "not live"
